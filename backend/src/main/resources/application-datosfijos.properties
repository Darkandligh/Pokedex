# Perfil "datosfijos": Pokémon N.º 0001 a 0009 en memoria, sin conexión a internet.
# Lo usan las pruebas automáticas; también sirve para una demostración sin red:
#   mvnw spring-boot:run -Dspring-boot.run.profiles=datosfijos
spring.datasource.url=jdbc:h2:mem:pokedex-fijos;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
pokedex.importacion.habilitada=false
