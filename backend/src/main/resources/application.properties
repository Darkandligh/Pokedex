spring.application.name=pokedex
server.port=8080

# Base de datos por defecto: H2 en archivo (los datos importados se conservan al reiniciar)
spring.datasource.url=jdbc:h2:file:./data/pokedex;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Importación desde PokéAPI (solo consulta los Pokémon que faltan en la base)
pokedex.importacion.habilitada=true
pokedex.importacion.url-base=https://pokeapi.co/api/v2
pokedex.importacion.cantidad=151
pokedex.importacion.pausa-ms=100

# Orígenes permitidos para el frontend en desarrollo (ionic serve, red local para probar en el celular)
pokedex.cors.origenes=http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,capacitor://localhost,ionic://localhost
