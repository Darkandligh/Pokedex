# Perfil opcional: PostgreSQL. Activar con --spring.profiles.active=postgres
# Requiere una base creada previamente, por ejemplo: CREATE DATABASE pokedex;
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/pokedex}
spring.datasource.username=${POSTGRES_USUARIO:postgres}
spring.datasource.password=${POSTGRES_CLAVE:postgres}
